[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "parquet-export-gui"
version = "0.1.0"
description = "NiceGUI desktop app for exporting Oracle, MySQL, PostgreSQL, and MaxCompute tables to local Parquet files."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [
  {name = "Codex"},
]
dependencies = [
  "nicegui>=2.24,<3",
  "oracledb>=3.4,<5",
  "PyMySQL>=1.1,<2",
  "psycopg[binary]>=3.2,<4",
  "pyarrow>=19,<21",
  "pyodps>=0.12.5,<1",
  "pywebview>=5.4,<6",
]

[project.optional-dependencies]
build = [
  "nuitka>=2.7,<3",
  "ordered-set>=4.1,<5",
  "zstandard>=0.23,<1",
]

[project.scripts]
parquet-export-gui = "parquet_export_gui.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/parquet_export_gui"]
